# GENERATED by worker-rs/scripts/sync-template.sh from the monorepo's core/Cargo.toml.
# Only the workspace tables the vendored crates inherit from; do not edit by hand.

[workspace]
members = ["crates/*"]

[workspace.package]
edition = "2021"
publish = false

# The root package has carried these since long before the split; the moved code did not change, so the
# lint posture must not either. Declared centrally so every crate inherits the same judgement instead of
# each one rediscovering it.
[workspace.lints.clippy]
result_large_err = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
doc_lazy_continuation = "allow"
doc_overindented_list_items = "allow"

# Shared by the root package AND the split crates. Central so that `#[from] rusqlite::Error` means the
# SAME type on both sides of a crate boundary; two independent declarations that resolved differently
# would break the conversions in a way whose error message points nowhere useful.
[workspace.dependencies]
thiserror         = "1"
vodozemac         = "0.10"
serde_json        = "1"
rusqlite          = { version = "0.40", features = ["bundled", "blob"] }
reqwest           = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
blake3            = "1.5"
hex               = "0.4"
serde             = { version = "1", features = ["derive"] }
tar               = "0.4"
chacha20poly1305  = { version = "0.10", features = ["stream"] }
rand              = { version = "0.8", features = ["std", "std_rng"] }
# `CancellationToken` (handed out by `sezi-transfer`, selected on in this crate's chunk loops)
# and `UnboundedSender<TransferProgress>` (built by the kernel, stored by the crate) both cross
# the boundary — two declarations resolving differently would fail at those call sites.
# The features here are the WASM-SAFE core, deliberately. `net` and `rt-multi-thread` are what
# drag in `mio`, which does not build for wasm32 and says so ("This wasm target is unsupported
# by mio. If using Tokio, disable the net feature"). Cargo unifies features across a build, so
# ONE crate asking for `tokio/net` puts mio in front of every other crate too — which is exactly
# how the whole workspace inherited a native-only floor.
#
# Whoever genuinely needs the sockets or the multi-thread scheduler adds them back on a
# `cfg(not(target_arch = "wasm32"))` target section. Native resolves to the same feature set it
# always had.
tokio             = { version = "1", features = ["macros", "sync", "io-util", "time", "rt"] }
tokio-util        = { version = "0.7", default-features = false, features = ["rt"] }
# Three users now: `sezi-crypto::kdf`, `sezi-store` (auth/identity stores) and this crate's `depot`.
argon2            = "0.5"
# `sezi-net::build_tls_config` returns a `rustls::ClientConfig` that this crate's WS path wraps in
# tokio-rustls, and `client/sync.rs` installs the aws-lc-rs provider PROCESS-GLOBALLY. Two resolutions
# would compile and then fail the handshake at runtime — the provider installed in one does not apply
# to the other. This is the sharpest reason the workspace-dependency rule exists.
rustls            = { version = "0.23", features = ["aws-lc-rs"] }
# Shared: this crate streams reqwest bodies (client/, link_meta, depot) and so does `sezi-net`. The
# `StreamExt` impls have to come from ONE futures-util or they do not apply.
futures-util      = { version = "0.3", default-features = false, features = ["std", "sink"] }
# `std::time::SystemTime::now()` and `Instant::now()` PANIC on wasm32-unknown-unknown — the
# target has no clock and std says so at runtime ("time not implemented on this platform"),
# which is how the browser build died right after the kernel spawned. `web-time` answers from
# `Date.now()` / `performance.now()` there and RE-EXPORTS the std types everywhere else, so
# native is not merely equivalent, it is the same type. Shared here because the swap has to be
# uniform: a `web_time::SystemTime` and a `std::time::SystemTime` do not compare.
web-time          = "1.1"

