# Sezi Server — Cloudflare Worker (self-host template)
#
# This file is kept in the Sezi monorepo (worker-rs/template/wrangler.toml) and copied into the
# template repository by worker-rs/scripts/sync-template.sh. Edit it THERE; a change made only in
# the template repository is overwritten by the next sync.
#
# This file is parametric for the "Deploy to Cloudflare" button: the resources it declares (D1,
# KV, the R2 bucket) are created during the button's flow and their IDs written back here
# automatically. Installing from the CLI instead? Create the resources with the commands in the
# README and paste the real IDs in.
#
# PREBUILT: `build/` contains compiled WASM, so deploying needs NO Rust toolchain. The absence of
# a [build] section is deliberate — `wrangler deploy` only uploads.
#
# `lite/` is the same server WITHOUT the R2 bucket, generated from this file by
# worker-rs/scripts/template-lite.sh — for an account that will not turn R2 on. Everything between
# the two "media" markers below is what it leaves out.

name = "sezi-server"
main = "build/worker/shim.mjs"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# D1 — the server database (members, invitations, queue metadata; message CONTENT is end-to-end
# encrypted and the server cannot read it). The schema installs itself on the first request
# (self-migration), so no migration command is needed.
[[d1_databases]]
binding = "DB"
database_name = "sezi"
# PLACEHOLDER: the "Deploy to Cloudflare" button creates a new D1 and rewrites this ID itself.
# The field has to EXIST for the button's parser to see it — that is Cloudflare's documented
# requirement, not a quirk of ours. From the CLI: `wrangler d1 create sezi`, then paste the real
# id from the output.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "./migrations"

# >>> media (template-lite.sh removes this block for lite/)
# R2 (photos, files, voice messages, the group library) — ON by default since 2026-11-04.
#
# Without it the server is "Lite": messaging, groups and calls work, but every upload answers
# 503 media_not_configured and /capabilities says media:false. A review server ran that way for a
# week before anyone noticed, so the template ships WITH media and the app's setup ladder reads
# /capabilities after the claim to prove it.
#
# The "Deploy to Cloudflare" button provisions this bucket itself (R2 is on Cloudflare's list of
# automatically provisioned resources). It needs R2 to be ENABLED on the account first: free up to
# 10 GB a month, but Cloudflare asks for a payment card to turn it on (dashboard -> R2 ->
# Overview). On an account without it, the deploy is reported to stop with "Please enable R2
# through the Cloudflare Dashboard" — enable it and deploy again, or use lite/ instead.
#
# A bucket by another name works as well; only the binding's NAME, MEDIA, is fixed
# (src/storage reads env.bucket("MEDIA")). From the CLI: `wrangler r2 bucket create sezi-media`.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "sezi-media"
# <<< media

# KV (rate limiting / brute-force brake) — ON. Like D1, the "Deploy to Cloudflare" button creates
# a new namespace and rewrites this ID itself, and its parser likewise wants the field to be
# present. `ratelimit.rs` looks up `env.kv("RATE_LIMIT")`, so the binding NAME is mandatory.
#
# The code FAILS OPEN: if KV's daily write limit (1000/day on the free tier) is exhausted the
# rate limiting loosens, but MESSAGING DOES NOT STOP — a lesson from the field, the 2026-06-27
# wedge. The brute-force targets (bootstrap/verify/invite, roughly 5-10 per 5 minutes) are rare
# enough that THAT protection is always live; the ordinary traffic brake is what gives way.
# From the CLI: `wrangler kv namespace create RATE_LIMIT`, then paste the real id.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "00000000000000000000000000000000"

# Durable Objects — a per-user inbox and a per-room plugin log. Created automatically on deploy;
# nothing to prepare.
[[durable_objects.bindings]]
name = "USER_INBOX"
class_name = "UserInbox"

[[durable_objects.bindings]]
name = "PLUGIN_ROOM_LOG"
class_name = "PluginRoomLog"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserInbox"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PluginRoomLog"]

# [triggers]/cron DELIBERATELY ABSENT: the CF free plan caps crons per ACCOUNT, and a second
# server in the same account failed at the cron step because of it. Maintenance (cleanup plus the
# delivery-retry drain) works without cron: the server performs it on the back of ordinary
# requests (lazy maintenance, src/maintenance.rs). Add a cron if you want one — dashboard ->
# Settings -> Triggers — and the lazy path stands down by itself, so nothing runs twice.

# [vars] DELIBERATELY ABSENT — every one of them has a safe default in code, so the deploy screen
# is just "name it and confirm": ENV=prod (fail-secure), JWT_ISSUER="sezi-server",
# TURN_MONTHLY_CAP=5000. To tune them: dashboard -> Settings -> Variables. Also available there:
# FCM_PROJECT_ID (Android push; it needs the FCM_SERVICE_ACCOUNT secret alongside it — you can
# also switch push on from inside the app, under Server -> Usage -> Notifications).

# -- Secrets -------------------------------------------------------------------------------
# SEZI_CLAIM_SECRET: your claim key — the deploy page asks for it (.dev.vars.example). Until the
#   server is claimed, only a request carrying it gets the founding invite.
# The rest are OPTIONAL:
# JWT_SIGNING_KEY / ADMIN_INVITE_KEY: if you do not set them the server GENERATES them on its
#   first boot and stores them in D1 (self-provisioning). To manage your own key instead,
#   `wrangler secret put JWT_SIGNING_KEY` (PKCS8 PEM, Ed25519) — an env value ALWAYS wins.
# TURN_KEY_ID / TURN_API_TOKEN: Cloudflare Realtime TURN (optional; without it calls fall back to
#   LAN/STUN).
# FCM_SERVICE_ACCOUNT: Firebase service-account JSON (optional; Android push).
# CF_API_TOKEN / CF_ACCOUNT_ID: the usage panel's "matches your bill exactly" mode — you can also
#   enter these from inside the app, under Server -> Usage -> CF Analytics.
