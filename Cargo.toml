[package]
name = "sezgi-worker-rs"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# The notify fan-out bench only (`bench/notify-fanout`): member and hop failures injected from
# BENCH_FAIL_* vars, so the retry, enqueue and drain paths run for real. Never in a deployed build.
bench-faults = []

[dependencies]
worker = { version = "0.8", features = ["d1", "http"] }
worker-macros = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"

# Crypto
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
# FCM HTTP v1 OAuth2 service-account JWT (RS256). Saf-Rust (WebCrypto subtle yerine);
# PKCS8 PEM import + deterministik PKCS1v15 imza (RNG gerektirmez).
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false }
hmac = "0.12"
# device_id türetimi (core ile parite: hex(blake3(ed_pub)[..8])). no_std/portable
# (wasm32 SIMD-yok fallback) — default-features kapalı.
blake3 = { version = "1", default-features = false }

# Sealing the frame a wake carries to its device (`push/carry.rs`). The core's own AEAD, so the
# two halves of the sealed form are one primitive; no default features (the nonce comes from
# `getrandom` below).
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }

# Encoding
base64 = "0.22"
hex = "0.4"

# Misc
uuid = { version = "1", features = ["v4", "js"] }
getrandom = { version = "0.2", features = ["js"] }

# Bounded concurrency for the group fan-out (`buffer_unordered`). Already in the tree through
# `worker`; named here so the fan-out can use it directly.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

# Wasm interop (D1 BLOB binding)
js-sys = "0.3"
wasm-bindgen = "0.2"

# The bot's end of the encryption runs inside the relay, in the bot's own UserInbox
# (docs/BOTS_BUILD.md §1). Path dependencies into core's workspace: cargo resolves their
# `workspace = true` keys through `core/Cargo.toml`. The self-host template vendors these crates
# and a generated workspace root (`scripts/sync-template.sh`), which rewrites the paths.
sezi-bot-engine = { path = "core/crates/sezi-bot-engine" }
sezi-protocol = { path = "core/crates/sezi-protocol" }
# A file a member sends a bot 1:1 (H3, docs/HEARINGS_BOT_PLAN.md §1.2): the bot's inbox opens the
# blob in-process with `decrypt_in_memory`, the kernel's own STREAM decryptor. Its in-memory path
# builds for wasm (the browser client runs it); nothing here touches its file-path I/O.
sezi-file = { path = "core/crates/sezi-file" }
# The hearing-minutes bot (docs/HEARINGS_BOT_PLAN.md, H4): its runner reads a record by rules
# (`sezi-hearings`: a PDF's text layer through lopdf, the header, the decisions) and masks every
# personal datum before anything leaves the relay (`sezi-redact`). Both are pure and build for
# wasm32 on their own; the self-host template vendors them with the others.
sezi-hearings = { path = "core/crates/sezi-hearings" }
sezi-redact = { path = "core/crates/sezi-redact" }

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
# The router's own matcher (the `worker` crate's, pinned to the version in Cargo.lock), so
# `invite_page/route_tests.rs` can insert the real routing table and prove `/:invite` shadows
# nothing.
matchit = "=0.7.3"
# A member device that speaks Olm the way a kernel does, so the bot inbox's tests drive the real
# engine through the DO store (`messages/inbox_do/bot/engine_tests.rs`).
sezi-crypto = { path = "core/crates/sezi-crypto" }
vodozemac = "0.10"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
