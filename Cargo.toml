[package]
name = "sezgi-worker-rs"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# The notify fan-out bench only (`bench/notify-fanout`): member and hop failures injected from
# BENCH_FAIL_* vars, so the retry, enqueue and drain paths run for real. Never in a deployed build.
bench-faults = []

[dependencies]
worker = { version = "0.8", features = ["d1", "http"] }
worker-macros = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"

# Crypto
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
# FCM HTTP v1 OAuth2 service-account JWT (RS256). Saf-Rust (WebCrypto subtle yerine);
# PKCS8 PEM import + deterministik PKCS1v15 imza (RNG gerektirmez).
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false }
hmac = "0.12"
# device_id türetimi (core ile parite: hex(blake3(ed_pub)[..8])). no_std/portable
# (wasm32 SIMD-yok fallback) — default-features kapalı.
blake3 = { version = "1", default-features = false }

# Encoding
base64 = "0.22"
hex = "0.4"

# Misc
uuid = { version = "1", features = ["v4", "js"] }
getrandom = { version = "0.2", features = ["js"] }

# Bounded concurrency for the group fan-out (`buffer_unordered`). Already in the tree through
# `worker`; named here so the fan-out can use it directly.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

# Wasm interop (D1 BLOB binding)
js-sys = "0.3"
wasm-bindgen = "0.2"

# The bot's end of the encryption runs inside the relay, in the bot's own UserInbox
# (docs/BOTS_BUILD.md §1). Path dependencies into core's workspace: cargo resolves their
# `workspace = true` keys through `core/Cargo.toml`. The self-host template vendors these crates
# and a generated workspace root (`scripts/sync-template.sh`), which rewrites the paths.
sezi-bot-engine = { path = "core/crates/sezi-bot-engine" }
sezi-protocol = { path = "core/crates/sezi-protocol" }

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
# The router's own matcher (the `worker` crate's, pinned to the version in Cargo.lock), so
# `invite_page/route_tests.rs` can insert the real routing table and prove `/:invite` shadows
# nothing.
matchit = "=0.7.3"
# A member device that speaks Olm the way a kernel does, so the bot inbox's tests drive the real
# engine through the DO store (`messages/inbox_do/bot/engine_tests.rs`).
sezi-crypto = { path = "core/crates/sezi-crypto" }
vodozemac = "0.10"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
