# /etc/nginx/conf.d/sezi-ws-shim.conf
#
# THE WS-101 BRIDGE (for the cloudflared path) — an official step.
#
# PROBLEM: in the chain cloudflared → wrangler dev's Node proxy → workerd, the WebSocket upgrade
# (HTTP 101) stalls. Root cause: wrangler dev's Node proxy does not always pass the
# Upgrade/Connection headers through intact. Symptom: the HTTP API works, but live delivery over
# /sync (WS) never connects, so messages arrive late or not at all.
#
# FIX: put a thin nginx shim in between: cloudflared → nginx (:8787) → wrangler (:8788). nginx
# normalises Upgrade/Connection EXPLICITLY and gives the WebSocket a long read timeout, so the 101
# gets through. (All of it on 127.0.0.1: nothing here is public; cloudflared runs on the same
# machine and connects to localhost.)
#
# LONG TERM: the shim is a TEMPORARY bridge that exists because wrangler dev is a dev server. A
# native relay that serves WS itself will not need it. On the caddy path (deploy/Caddyfile) it is
# not needed either: caddy proxies the upgrade as it is.
#
# INSTALL:
#   sudo apt install -y nginx
#   sudo cp deploy/sezi-ws-shim.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#   # point the cloudflared Public Hostname's service URL at http://127.0.0.1:8787
#
# AN INSTALL FROM BEFORE the two body lines (below) WERE ADDED: run once, as one line —
#   grep -q proxy_request_buffering /etc/nginx/conf.d/sezi-ws-shim.conf || { sudo sed -i '/listen 127.0.0.1:8787;/a\    client_max_body_size 210m;\n    proxy_request_buffering off;' /etc/nginx/conf.d/sezi-ws-shim.conf && sudo nginx -t && sudo systemctl reload nginx; }

# Connection header for WS: "upgrade" when the client asked for one, "close" otherwise (plain HTTP).
map $http_upgrade $sezi_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # localhost ONLY: cloudflared runs on this machine and connects here. NOT public.
    listen 127.0.0.1:8787;
    # Request bodies. nginx's default is 1 MB, which refuses (413) every upload larger than that
    # before the relay sees it: a 4 MiB part of a group-library recording, a photo, a voice note.
    # The relay enforces its own limits per route, so this only has to stay at or above the
    # largest of them — the instrument pack's 200 MiB (`instrument_pack.rs`; media and plugin
    # media are 50 MiB, a library object 33 MiB).
    client_max_body_size 210m;
    # ...and STREAM the body to the relay instead of buffering it. By default nginx first writes a
    # body this size to its own disk (client_body_temp) before the relay sees a byte — 210 MB of
    # disk any caller could fill without being a member, since the relay is what checks the token.
    # Streamed, nothing lands on this machine's disk, and the relay decides about a request from
    # its headers (who is asking, how big it says it is) before the body has arrived.
    proxy_request_buffering off;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8788;   # wrangler dev (sezi-relay.service)
        proxy_http_version 1.1;

        # REQUIRED for the WS 101:
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $sezi_connection_upgrade;
        proxy_set_header Host       $host;

        # cf-connecting-ip: cloudflared already sets the REAL client address (traffic from the CF
        # edge). Leave it alone — pass it through, so the per-IP rate limits (bootstrap, verify,
        # the invite page) see the real client. Overwriting it with $remote_addr here would put
        # everyone in one bucket and the per-IP limits would collapse, which is why it is
        # deliberately NOT set.

        # WebSocket lifetime: a live /sync connection stays open for days.
        proxy_read_timeout  7d;
        proxy_send_timeout  7d;
        proxy_buffering     off;
    }
}
